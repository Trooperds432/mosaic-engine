name: tests
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the packages the tested modules need (pinned as in requirements.txt)
        run: python -m pip install $(grep -E '^(numpy|pandas)==' requirements.txt)
      - name: Unit tests (gates, NYSE calendar, long/short rules)
        run: python -m unittest discover -s tests -v
